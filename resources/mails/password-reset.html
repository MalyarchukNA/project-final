<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <title th:text="#{mail.password.reset.title}">JiraRush - установить новый пароль</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="#{mail.greeting(${user.firstName})}">Привет.</p>
<p th:text="#{mail.password.reset.text(${user.email})}">Мы получили запрос на установку нового пароля JiraRush для учетной записи.</p>
<a th:href="${resetUrl}" th:text="#{mail.password.reset.button}">Установить пароль</a>
</body>
</html>
